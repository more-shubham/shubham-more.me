faq:
  title: Frequently Asked Questions
  description: Answers to common technical questions about my work and engagements.
  categories:
    - title: Technical Architecture & Stack
      questions:
        - label: What are your primary core technologies?
          content: |
            I specialize in Go (Golang), Node.js, Python, TypeScript, PostgreSQL, MongoDB, Redis, and Cloud Infrastructure (AWS / OCI). I focus heavily on low-level system design, fault tolerance, and clean domain-driven microservices.
        - label: What is your experience with Agentic AI?
          content: |
            I architect deterministic Agentic AI workflows using Python, LangChain, LangGraph state machines, RAG pipelines, and function calling to build resilient automation agents.
    - title: Engagement & Opportunities
      questions:
        - label: Are you available for remote Senior/Staff Architect roles?
          content: |
            Yes, I am available for full-time Senior Software Engineer, Staff Engineer, or System Architect roles worldwide.
